<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>Alea Jacta : Clock Tracker</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="layout_base.css">
    <link rel="stylesheet" href="clock.css">
    <script src="clock_v2.js"></script>
  </head>
  <body>
    <header>
      <h1>Alea Jacta : Clock Tracker</h1>
      <p>Un outil pour générer et suivre les clocks (inspirés du système BiTD)</p>
    </header>
    <nav>
      <a href="index.html">Accueil</a>
      <a class="active" href="clock_tracker.html">Horloges</a>
      <a href="dice_roller.html">Dés</a>
    </nav>
    <main>
      <div class="clock">
        <input type="text" value="Titre">
        <button class="minusButton">-</button>
        <button class="plusButton">+</button>
        <progress value="2" max="4"></progress>
      </div>  
      <template>  
        <div class="clock">
          <input type="text" value="Titre">
          <button class="minusButton">-</button>
          <button class="plusButton">+</button>
          <progress value="2" max="4"></progress>
        </div>  
      </template>
    </main>
  </body>
</html>
